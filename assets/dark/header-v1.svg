" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="cph"><rect width="900" height="210" rx="10"/></clipPath></defs><g clip-path="url(#cph)"><rect x="-320" y="0" width="300" height="210" fill="url(#swh)"><animateTransform attributeName="transform" type="translate" values="0 0;1240 0;1240 0" keyTimes="0;0.42;1" dur="9s" begin="1.2s" repeatCount="indefinite"/></rect></g></svg>