<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="210" viewBox="0 0 900 210" role="img">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
.cur{animation:blink 1.05s step-end infinite}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-40px)}}
.scan{animation:drift 9s linear infinite}
</style>
<defs><linearGradient id="aur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.16"><animate attributeName="offset" values="0;0.35;0" dur="14s" repeatCount="indefinite"/></stop><stop offset="0.55" stop-color="#bc8cff" stop-opacity="0.13"><animate attributeName="offset" values="0.55;0.8;0.55" dur="14s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#c9d1d9" opacity="0.055"/></pattern><filter id="glow" x="-25%" y="-60%" width="150%" height="220%"><feGaussianBlur stdDeviation="3" result="b"><animate attributeName="stdDeviation" values="2.2;5;2.2" dur="5.5s" repeatCount="indefinite"/></feGaussianBlur><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="hc"><rect width="900" height="210" rx="10"/></clipPath><clipPath id="typ0"><rect x="58.0" y="150" width="0" height="26"><animate attributeName="width" values="0;0;459;459;0;0" keyTimes="0;0.0000;0.1000;0.2556;0.3111;1" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="typ1"><rect x="58.0" y="150" width="0" height="26"><animate attributeName="width" values="0;0;477;477;0;0" keyTimes="0;0.3333;0.4333;0.5889;0.6444;1" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="typ2"><rect x="58.0" y="150" width="0" height="26"><animate attributeName="width" values="0;0;504;504;0;0" keyTimes="0;0.6667;0.7667;0.9222;0.9778;1" dur="18s" repeatCount="indefinite"/></rect></clipPath></defs><rect width="900" height="210" rx="10" fill="#0d1117"/><rect x="0.5" y="0.5" width="899" height="209" rx="10" fill="none" stroke="#30363d" opacity="0.5"/><g clip-path="url(#hc)"><rect width="900" height="210" fill="url(#aur)"/><rect class="scan" y="-40" width="900" height="290" fill="url(#scan)"/></g><path d="M0 10a10 10 0 0 1 10-10h880a10 10 0 0 1 10 10v24H0z" fill="#161b22"/><line x1=