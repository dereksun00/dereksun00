<rect width="900" height="396" rx="10" fill="#0d1117"/><rect x="0.5" y="0.5" width="899" height="395" rx="10" fill="none" stroke="#30363d" opacity="0.5"/><rect x="24" y="30" width="3" height="58" rx="1.5" fill="#58a6ff"><animate attributeName="height" values="0;58" dur="0.6s" begin="0.15s" keyTimes="0;1" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/></rect><text x="42" y="46" font-size="16" font-weight="700" letter-spacing="0.3" fill="#58a6ff">T-Care<animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.65s" fill="freeze"/></text><text x="42" y="66" font-size="12" letter-spacing="0.4" fill="#f0883e">1st place — AWS x UofT Hackathon<animate attributeName="opacity" from="0" to="1" begin="0.22999999999999998s" dur="0.65s" fill="freeze"/></text><text x="42" y="86" font-size="13" fill="#c9d1d9">Turns "I lost my TCard" into the exact campus office to visit.<animate attributeName="opacity" from="0" to="1" begin="0.29000000000000004s" dur="0.65s" fill="freeze"/></text><text x="42" y="104" font-size="13" fill="#8b949e">Bedrock + React/Node, routing across 30+ services.<animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.65s" fill="freeze"/></text><rect x="24" y="118" width="3" height="58" rx="1.5" fill="#58a6ff"><animate attributeName="height" values="0;58" dur="0.6s" begin="0.29000000000000004s" keyTimes="0;1" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/></rect><text x="42" y="134" font-size="16" font-weight="700" letter-spacing="0.3" fill="#58a6ff">Fall Detection App<animate attributeName="opacity" from="0" to="1" begin="0.29000000000000004s" dur="0.65s" fill="freeze"/></text><text x="42" y="154" font-size="12" letter-spacing="0.4" fill="#f0883e">React Native + TCN<animate attributeName="opacity" from="0" to="1" begin="0.37000000000000005s" dur="0.65s" fill="freeze"/></text><text x="42" y="174" font-size="13" fill="#c9d1d9">Catches a fall from motion data in real time,<animate attributeName="opacity" from="0" to="1" begin="0.43000000000000005s" dur="0.65s" fill="freeze"/></text><text x="42" y="192" font-size="13" fill="#8b949e">streaming sensor input at 50 Hz.<animate attributeName="opacity" from="0" to="1" begin="0.49000000000000005s" dur="0.65s" fill="freeze"/></text><rect x="24" y="206" width="3" height="58" rx="1.5" fill="#58a6ff"><animate attributeName="height" values="0;58" dur="0.6s" begin="0.43000000000000005s" keyTimes="0;1" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/></rect><text x="42" y="222" font-size="16" font-weight="700" letter-spacing="0.3" fill="#58a6ff">Demo &amp; Test Environments<animate attributeName="opacity" from="0" to="1" begin="0.43000000000000005s" dur="0.65s" fill="freeze"/></text><text x="42" y="242" font-size="12" letter-spacing="0.4" fill="#f0883e">Docker + Postgres<animate attributeName="opacity" from="0" to="1" begin="0.51s" dur="0.65s" fill="freeze"/></text><text x="42" y="262" font-size="13" fill="#c9d1d9">Spins up realistic, disposable demo environments<animate attributeName="opacity" from="0" to="1" begin="0.5700000000000001s" dur="0.65s" fill="freeze"/></text><text x="42" y="280" font-size="13" fill="#8b949e">so teams stop testing against real user data.<animate attributeName="opacity" from="0" to="1" begin="0.6300000000000001s" dur="0.65s" fill="freeze"/></text><rect x="24" y="294" width="3" height="58" rx="1.5" fill="#58a6ff"><animate attributeName="height" values="0;58" dur="0.6s" begin="0.5700000000000001s" keyTimes="0;1" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/></rect><text x="42" y="310" font-size="16" font-weight="700" letter-spacing="0.3" fill="#58a6ff">Squat-Depth Judge (iOS)<animate attributeName="opacity" from="0" to="1" begin="0.5700000000000001s" dur="0.65s" fill="freeze"/></text><text x="42" y="330" font-size="12" letter-spacing="0.4" fill="#f0883e">Swift + MediaPipe<animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.65s" fill="freeze"/></text><text x="42" y="350" font-size="13" fill="#c9d1d9">Judges squat depth from video the way a meet ref would.<animate attributeName="opacity" from="0" to="1" begin="0.7100000000000001s" dur="0.65s" fill="freeze"/></text><text x="42" y="368" font-size="13" fill="#8b949e">~90% accurate across 100+ labelled clips.<animate attributeName="opacity" from="0" to="1" begin="0.77s" dur="0.65s" fill="freeze"/></text><line x1="9" y1="24" x2="9" y2="372" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="11 9" opacity="0.85"><animate attributeName="stroke-dashoffset" values="0;-40" dur="1.9s" repeatCount="indefinite"/></line><defs><linearGradient id="swp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><clipPath id="cpp"><rect width="900" height="396" rx="10"/></clipPath></defs><g clip-path="url(#cpp)"><rect x="-320" y="0" width="300" height="396" fill="url(#swp)"><animateTransform attributeName="transform" type="translate" values="0 0;1240 0;1240 0" keyTimes="0;0.42;1" dur="10s" begin="1.5s" repeatCount="indefinite"/></rect></g></svg>