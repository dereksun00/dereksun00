<rect x="24" y="14" width="2" height="62" fill="#000000"><animate attributeName="height" values="0;0;62" keyTimes="0;0.2000;1" dur="0.75s" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1" fill="freeze"/></rect><text x="42" y="28" font-size="15.5" font-weight="700" letter-spacing="0.3" fill="#000000">T-Care<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2000;1" dur="0.75s" fill="freeze"/></text><text x="42" y="48" font-size="11.5" letter-spacing="1.2" fill="#5a5a5a">1ST PLACE — AWS X UOFT HACKATHON<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.2683;1" dur="0.82s" fill="freeze"/></text><text x="42" y="68" font-size="13" fill="#000000">Turns “I lost my TCard” into the exact campus office to visit.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3182;1" dur="0.88s" fill="freeze"/></text><text x="42" y="86" font-size="13" fill="#5a5a5a">Bedrock + React/Node, routing across 30+ services.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3548;1" dur="0.93s" fill="freeze"/></text><rect x="24" y="98" width="2" height="62" fill="#000000"><animate attributeName="height" values="0;0;62" keyTimes="0;0.3182;1" dur="0.88s" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1" fill="freeze"/></rect><text x="42" y="112" font-size="15.5" font-weight="700" letter-spacing="0.3" fill="#000000">Fall Detection App<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3182;1" dur="0.88s" fill="freeze"/></text><text x="42" y="132" font-size="11.5" letter-spacing="1.2" fill="#5a5a5a">REACT NATIVE + TCN<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3684;1" dur="0.95s" fill="freeze"/></text><text x="42" y="152" font-size="13" fill="#000000">Catches a fall from motion data in real time,<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4059;1" dur="1.01s" fill="freeze"/></text><text x="42" y="170" font-size="13" fill="#5a5a5a">streaming sensor input at 50 Hz.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4340;1" dur="1.06s" fill="freeze"/></text><rect x="24" y="182" width="2" height="62" fill="#000000"><animate attributeName="height" values="0;0;62" keyTimes="0;0.4059;1" dur="1.01s" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1" fill="freeze"/></rect><text x="42" y="196" font-size="15.5" font-weight="700" letter-spacing="0.3" fill="#000000">Demo &amp; Test Environments<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4059;1" dur="1.01s" fill="freeze"/></text><text x="42" y="216" font-size="11.5" letter-spacing="1.2" fill="#5a5a5a">DOCKER + POSTGRES<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4444;1" dur="1.08s" fill="freeze"/></text><text x="42" y="236" font-size="13" fill="#000000">Spins up realistic, disposable demo environments<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4737;1" dur="1.14s" fill="freeze"/></text><text x="42" y="254" font-size="13" fill="#5a5a5a">so teams stop testing against real user data.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4958;1" dur="1.19s" fill="freeze"/></text><rect x="24" y="266" width="2" height="62" fill="#000000"><animate attributeName="height" values="0;0;62" keyTimes="0;0.4737;1" dur="1.14s" calcMode="spline" keySplines="0 0 1 1;0.16 1 0.3 1" fill="freeze"/></rect><text x="42" y="280" font-size="15.5" font-weight="700" letter-spacing="0.3" fill="#000000">Squat-Depth Judge (iOS)<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4737;1" dur="1.14s" fill="freeze"/></text><text x="42" y="300" font-size="11.5" letter-spacing="1.2" fill="#5a5a5a">SWIFT + MEDIAPIPE<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5041;1" dur="1.21s" fill="freeze"/></text><text x="42" y="320" font-size="13" fill="#000000">Judges squat depth from video the way a meet ref would.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5276;1" dur="1.27s" fill="freeze"/></text><text x="42" y="338" font-size="13" fill="#5a5a5a">~90% accurate across 100+ labelled clips.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5455;1" dur="1.32s" fill="freeze"/></text><line x1="10" y1="22" x2="10" y2="342" stroke="#cfcfcf" stroke-width="2" stroke-dasharray="320"><animate attributeName="stroke-dashoffset" values="320;320;0" keyTimes="0;0.0476;1" dur="1.05s" fill="freeze"/></line><line x1="0" y1="0" x2="0" y2="364" stroke="#000000" stroke-width="1" opacity="0.14"><animateTransform attributeName="transform" type="translate" values="0 0;900 0;900 0" keyTimes="0;0.28;1" dur="16s" begin="3.5s" repeatCount="indefinite"/></line></svg>