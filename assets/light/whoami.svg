<rect width="900" height="172" rx="10" fill="#ffffff"/><rect x="0.5" y="0.5" width="899" height="171" rx="10" fill="none" stroke="#d0d7de" opacity="0.8"/><line x1="9" y1="24" x2="9" y2="148" stroke="#0969da" stroke-width="3" stroke-linecap="round" stroke-dasharray="11 9" opacity="0.85"><animate attributeName="stroke-dashoffset" values="0;-40" dur="1.9s" repeatCount="indefinite"/></line><text x="34" y="46" font-size="14.5" fill="#1f2328" letter-spacing="0.2">2nd-year CS at UofT — AI specialization, Statistics minor, 3.93 GPA.<animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.65s" fill="freeze"/></text><text x="34" y="76" font-size="14.5" fill="#1f2328" letter-spacing="0.2">Software Engineer Intern at Nova Vacation Homes: voice AI receptionist,<animate attributeName="opacity" from="0" to="1" begin="0.28s" dur="0.65s" fill="freeze"/></text><text x="34" y="106" font-size="14.5" fill="#1f2328" letter-spacing="0.2">RAG pipeline, smart-lock integrations. And at Maybole: AI outreach platform.<animate attributeName="opacity" from="0" to="1" begin="0.41000000000000003s" dur="0.65s" fill="freeze"/></text><text x="34" y="136" font-size="14.5" fill="#1f2328" letter-spacing="0.2">Hackathons most weekends. 425 lb squat when I'm not at a keyboard.<animate attributeName="opacity" from="0" to="1" begin="0.54s" dur="0.65s" fill="freeze"/></text><defs><linearGradient id="sww" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da" stop-opacity="0"/><stop offset="0.5" stop-color="#0969da" stop-opacity="0.07"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></linearGradient><clipPath id="cpw"><rect width="900" height="172" rx="10"/></clipPath></defs><g clip-path="url(#cpw)"><rect x="-320" y="0" width="300" height="172" fill="url(#sww)"><animateTransform attributeName="transform" type="translate" values="0 0;1240 0;1240 0" keyTimes="0;0.42;1" dur="8s" begin="2s" repeatCount="indefinite"/></rect></g></svg>